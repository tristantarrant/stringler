<div class="mod-pedal sl-pedal">
    <div mod-role="drag-handle" class="mod-drag-handle"></div>
    <div class="sl-toggle sl-mode" mod-role="input-control-port" mod-port-symbol="mode" mod-widget="film"></div>
    <div class="sl-knob sl-bend" mod-role="input-control-port" mod-port-symbol="bend" mod-widget="film"></div>
    <div class="sl-knob sl-steal" mod-role="input-control-port" mod-port-symbol="steal" mod-widget="film"></div>
    <div class="sl-knob sl-gate" mod-role="input-control-port" mod-port-symbol="gate" mod-widget="film"></div>
    <div class="sl-knob sl-legatoms" mod-role="input-control-port" mod-port-symbol="legatoms" mod-widget="film"></div>
    <div class="sl-toggle sl-legato" mod-role="input-control-port" mod-port-symbol="legato" mod-widget="film"></div>
    <div class="sl-knob sl-vibdepth" mod-role="input-control-port" mod-port-symbol="vibdepth" mod-widget="film"></div>
    <div class="sl-knob sl-vibrate" mod-role="input-control-port" mod-port-symbol="vibrate" mod-widget="film"></div>
    <div class="sl-knob sl-chordshift" mod-role="input-control-port" mod-port-symbol="chordshift" mod-widget="film"></div>
    <div class="sl-select sl-select-chordwheel">
        <select mod-role="input-control-port" mod-port-symbol="chordwheel" mod-widget="select" title="chordwheel">
            <option value="0">Off</option>
            <option value="1">Major</option>
            <option value="2">Minor</option>
            <option value="3">Diminished</option>
        </select>
        <span class="sl-caret">▾</span>
    </div>
    <div class="sl-knob sl-transpose" mod-role="input-control-port" mod-port-symbol="transpose" mod-widget="film"></div>
    <div class="sl-select sl-select-scale">
        <select mod-role="input-control-port" mod-port-symbol="scale" mod-widget="select" title="scale">
            <option value="0">Off</option>
            <option value="1">Major</option>
            <option value="2">Minor</option>
            <option value="3">Harmonic Minor</option>
            <option value="4">Melodic Minor</option>
            <option value="5">Dorian</option>
            <option value="6">Locrian</option>
            <option value="7">Diminished</option>
            <option value="8">Augmented</option>
            <option value="9">Spanish</option>
            <option value="10">Flamenco</option>
            <option value="11">Mixolydian</option>
            <option value="12">Lydian</option>
            <option value="13">Lydian Minor</option>
            <option value="14">Lydian Augmented</option>
            <option value="15">Lydian Dominant</option>
            <option value="16">Blues</option>
            <option value="17">Chromatic</option>
        </select>
        <span class="sl-caret">▾</span>
    </div>
    <div class="sl-select sl-select-root">
        <select mod-role="input-control-port" mod-port-symbol="root" mod-widget="select" title="root">
            <option value="0">C</option>
            <option value="1">C#</option>
            <option value="2">D</option>
            <option value="3">D#</option>
            <option value="4">E</option>
            <option value="5">F</option>
            <option value="6">F#</option>
            <option value="7">G</option>
            <option value="8">G#</option>
            <option value="9">A</option>
            <option value="10">A#</option>
            <option value="11">B</option>
        </select>
        <span class="sl-caret">▾</span>
    </div>
    <div class="sl-knob sl-octdown" mod-role="input-control-port" mod-port-symbol="octdown" mod-widget="film"></div>
    <div class="sl-select sl-select-outchan">
        <select mod-role="input-control-port" mod-port-symbol="outchan" mod-widget="select" title="outchan">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
        </select>
        <span class="sl-caret">▾</span>
    </div>
    <div class="sl-knob sl-brightamt" mod-role="input-control-port" mod-port-symbol="brightamt" mod-widget="film"></div>
    <div class="sl-knob sl-brightcc" mod-role="input-control-port" mod-port-symbol="brightcc" mod-widget="film"></div>
    <div class="sl-knob sl-loudamt" mod-role="input-control-port" mod-port-symbol="loudamt" mod-widget="film"></div>
    <div class="sl-knob sl-loudcc" mod-role="input-control-port" mod-port-symbol="loudcc" mod-widget="film"></div>
    <div class="sl-knob sl-velnorm" mod-role="input-control-port" mod-port-symbol="velnorm" mod-widget="film"></div>
    <div class="sl-select sl-select-lowschan">
        <select mod-role="input-control-port" mod-port-symbol="lowschan" mod-widget="select" title="lowschan">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
        </select>
        <span class="sl-caret">▾</span>
    </div>
    <div class="sl-select sl-select-split">
        <select mod-role="input-control-port" mod-port-symbol="split" mod-widget="select" title="split">
            <option value="0">Off</option>
            <option value="40">E2</option>
            <option value="41">F2</option>
            <option value="42">F#2</option>
            <option value="43">G2</option>
            <option value="44">G#2</option>
            <option value="45">A2</option>
            <option value="46">A#2</option>
            <option value="47">B2</option>
            <option value="48">C3</option>
            <option value="49">C#3</option>
            <option value="50">D3</option>
            <option value="51">D#3</option>
            <option value="52">E3</option>
            <option value="53">F3</option>
            <option value="54">F#3</option>
            <option value="55">G3</option>
            <option value="56">G#3</option>
            <option value="57">A3</option>
            <option value="58">A#3</option>
            <option value="59">B3</option>
            <option value="60">C4</option>
            <option value="61">C#4</option>
            <option value="62">D4</option>
            <option value="63">D#4</option>
            <option value="64">E4</option>
        </select>
        <span class="sl-caret">▾</span>
    </div>
    <div class="sl-select sl-select-highschan">
        <select mod-role="input-control-port" mod-port-symbol="highschan" mod-widget="select" title="highschan">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
        </select>
        <span class="sl-caret">▾</span>
    </div>
    <div class="sl-knob sl-tracklow" mod-role="input-control-port" mod-port-symbol="tracklow" mod-widget="film"></div>
    <div class="sl-knob sl-trackres" mod-role="input-control-port" mod-port-symbol="trackres" mod-widget="film"></div>
    <div class="sl-knob sl-trackbright" mod-role="input-control-port" mod-port-symbol="trackbright" mod-widget="film"></div>
    <div class="sl-knob sl-trackjitter" mod-role="input-control-port" mod-port-symbol="trackjitter" mod-widget="film"></div>
    <div class="sl-knob sl-bendtrig" mod-role="input-control-port" mod-port-symbol="bendtrig" mod-widget="film"></div>
    <div class="sl-toggle sl-source" mod-role="input-control-port" mod-port-symbol="source" mod-widget="film"></div>
    <div class="sl-foot mod-footswitch" mod-role="bypass"></div>
    <div class="sl-led mod-light" mod-role="bypass-light"></div>
    <div class="mod-pedal-input">
        {{#effect.ports.audio.input}}
        <div class="mod-input mod-input-disconnected" title="{{name}}" mod-role="input-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-input-image"></div>
        </div>
        {{/effect.ports.audio.input}}
    </div>
    <div class="mod-pedal-output">
        {{#effect.ports.audio.output}}
        <div class="mod-output mod-output-disconnected" title="{{name}}" mod-role="output-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-output-image"></div>
        </div>
        {{/effect.ports.audio.output}}
    </div>
</div>
